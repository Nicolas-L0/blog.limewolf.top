{{ define "main" }}
<div class="fixed inset-0 -z-10 overflow-hidden bg-gradient-to-br from-[#31326f] via-[#28295c] to-[#1f2048]">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="absolute inset-0 opacity-10 mix-blend-overlay pointer-events-none" style="background-image: url('https://grainy-gradients.vercel.app/noise.svg'); background-size: 256px;"></div>
</div>

<section class="relative z-10 pt-28 pb-24 md:pb-32 max-w-5xl mx-auto px-6 md:px-8">
  <header class="mb-12">
    <h1 class="font-heading text-4xl md:text-6xl font-bold uppercase leading-tight drop-shadow-lg">{{ .Title }}</h1>
    <div class="w-full h-px bg-gradient-to-r from-transparent via-white/20 to-transparent mt-4"></div>
  </header>

  <div class="flex flex-wrap gap-3">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="border border-white/20 px-4 py-2 rounded-full text-sm text-gray-300 hover:text-white hover:border-neo-mint hover:bg-neo-mint/5 transition-all no-underline font-mono">
      {{ .Title }}
      <span class="text-xs text-gray-500 ml-1">({{ len .Pages }})</span>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
