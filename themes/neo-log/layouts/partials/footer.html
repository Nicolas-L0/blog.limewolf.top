<footer class="relative z-10 border-t border-white/10 mt-20 md:mt-32">
  <div class="max-w-7xl mx-auto px-6 md:px-8 py-10 md:py-16">

      <div class="space-y-3">
        <div class="font-heading text-2xl md:text-4xl font-bold tracking-tighter text-white">

        </div>

      </div>
      <div class="flex items-center gap-6 md:gap-8">

        <a href="/index.xml" class="text-gray-400 hover:text-white font-bold uppercase tracking-widest transition-colors no-underline text-xs md:text-sm">RSS</a>
      </div>
    </div>
    <!-- Divider + Copyright -->
    <div class="border-t border-white/10 pt-6 md:pt-8">

        {{ . | safeHTML }}

    </div>
